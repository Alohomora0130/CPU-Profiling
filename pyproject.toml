[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-cpu-profiler"
version = "0.1.0"
description = "Linux continuous CPU profiling tool powered by perf"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Trae AI" }
]
dependencies = []

[project.scripts]
cpu-profiler = "continuous_cpu_profiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
